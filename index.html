    <script>
      // Scale the 960x540 stage to fit whatever size the window/pane currently is. A ResizeObserver catches
      // pane resizes that do not fire the window 'resize' event; clientWidth/Height ignore scrollbars.
      const fit=()=>{const r=document.documentElement;const s=Math.min(r.clientWidth/960,r.clientHeight/540);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`};
      addEventListener('resize',fit);new ResizeObserver(fit).observe(document.documentElement);fit();
